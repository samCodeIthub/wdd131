<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div class="card">
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form method="get" action="review.html">

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <select id="productName" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="form-group rating-group">
                    <legend>Overall Rating</legend>

                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        &star;
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        &star;&star;
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        &star;&star;&star;
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        &star;&star;&star;&star;
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        &star;&star;&star;&star;&star;
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <fieldset class="form-group checkbox-group">
                    <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>

                    <label for="featureDurability">
                        <input type="checkbox" id="featureDurability" name="features" value="durability">
                        Durability
                    </label>

                    <label for="featureEase">
                        <input type="checkbox" id="featureEase" name="features" value="ease of use">
                        Ease of Use
                    </label>

                    <label for="featurePerformance">
                        <input type="checkbox" id="featurePerformance" name="features" value="performance">
                        Performance
                    </label>

                    <label for="featureDesign">
                        <input type="checkbox" id="featureDesign" name="features" value="design">
                        Design
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="review">Written Review <span class="optional">(Optional)</span></label>
                    <textarea id="review" name="review" rows="5"></textarea>
                </div>

                <div class="form-group">
                    <label for="username">Your Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-group">
                    <input type="submit" value="Post Review">
                </div>

            </form>
        </main>
    </div>

    <footer>
        <p>&copy; <span id="currentyear"></span> Samuel Motey Howard, Ghana</p>
        <p id="lastModified"></p>
    </footer>

    <script src="scripts/form.js"></script>
</body>

</html>
